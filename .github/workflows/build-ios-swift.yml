name: Build iOS App (Swift & Appetize Simulator)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for Real iPhone (.ipa)
        run: |
          set -e
          
          if [ -d "ios_swift_project" ]; then
            cd ios_swift_project
          fi

          echo "Building GeoTrack for Device..."
          xcodebuild clean build \
            -project GeoTrack.xcodeproj \
            -scheme GeoTrack \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build

          echo "Packaging GeoTrack.ipa..."
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/GeoTrack.app build/Payload/
          (cd build && zip -r GeoTrack.ipa Payload)

      - name: Build for Appetize.io (iOS Simulator .zip)
        run: |
          set -e

          if [ -d "ios_swift_project" ]; then
            cd ios_swift_project
          fi

          echo "Building GeoTrack for iOS Simulator (Appetize.io compatible)..."
          xcodebuild build \
            -project GeoTrack.xcodeproj \
            -scheme GeoTrack \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build

          echo "Packaging GeoTrack-Appetize-Simulator.zip..."
          cd build/Release-iphonesimulator
          zip -r ../GeoTrack-Appetize-Simulator.zip GeoTrack.app

      - name: Upload Real Device IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeoTrack-iOS-Device-IPA
          path: |
            **/build/GeoTrack.ipa

      - name: Upload Appetize.io Simulator ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GeoTrack-Appetize-Simulator
          path: |
            **/build/GeoTrack-Appetize-Simulator.zip
